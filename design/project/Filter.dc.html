<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Filter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #8B8A86; font-family: Inter, system-ui, sans-serif; color: #15171A; -webkit-font-smoothing: antialiased">
  <a href="Bibliotek.dc.html" aria-label="Stäng" style="position: absolute; inset: 0"></a>
  <div role="dialog" aria-label="Filter" style="position: absolute; left: 0; right: 0; bottom: 0; height: 793px; background: #F5F4EF; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 32px rgba(0,0,0,0.18); display: flex; flex-direction: column">
    <div style="padding: 8px 20px 12px">
      <div style="display: flex; justify-content: center; padding-bottom: 8px"><span style="width: 40px; height: 5px; border-radius: 999px; background: #E2E0D8"></span></div>
      <div style="display: flex; align-items: center; gap: 12px">
        <h2 style="flex: 1; margin: 0; font-family: Manrope, Inter, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.02em">Filter</h2>
        <a href="Bibliotek.dc.html" aria-label="Stäng" style="width: 40px; height: 40px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E0D8; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="x" size="18" hint-size="18px,18px"></dc-import></a>
      </div>
    </div>
    <div style="flex: 1; overflow-y: auto; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 24px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
        <div>
          <div style="font-size: 13px; font-weight: 600; color: #5C6066; margin-bottom: 6px">{{g.label}}</div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{g.chips}}" as="c" hint-placeholder-count="6">
              <button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-weight: {{c.w}}">{{c.label}}</button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="border-top: 1px solid #EEEDE7; padding: 12px 16px 20px; display: flex; gap: 10px">
      <button onClick="{{clear}}" style="flex: 1; height: 48px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E0D8; font-weight: 600; font-size: 15px; color: #15171A; opacity: {{clearOpacity}}">Rensa</button>
      <a href="Bibliotek.dc.html" style="flex: 2; height: 48px; border-radius: 999px; background: #1F6B45; color: #FFFFFF; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center">Visa {{count}} rätter</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: { 'Protein:Kyckling': true, 'Taggar:Snabb': true, 'Kök:Asiatisk': true } }; }
  renderVals() {
    const G = [
      ['Protein', ['Kyckling', 'Nöt', 'Fläsk', 'Fisk', 'Skaldjur', 'Lamm', 'Vilt', 'Vegetarisk', 'Vegan']],
      ['Kolhydrat', ['Ris', 'Pasta', 'Potatis', 'Nudlar', 'Bröd', 'Lågkolhydrat']],
      ['Kök', ['Svensk', 'Italiensk', 'Asiatisk', 'Japansk', 'Koreansk', 'Indisk', 'Mellanöstern', 'Mexikansk', 'Fransk', 'Nordafrikansk', 'Övrigt']],
      ['Typ', ['Soppa', 'Sallad', 'Paj', 'Gryta', 'Grillat', 'Bowl', 'Burgare', 'Taco', 'Wrap', 'Pizza', 'Pasta', 'Curry', 'Risotto', 'Omelett', 'Smörgås', 'Wok', 'Sushi', 'Köttbit']],
      ['Taggar', ['Snabb', 'Festlig', 'Barnvänlig', 'Low FODMAP', 'LCHF', 'Stark', 'Låg fetthalt']]
    ];
    const sel = this.state.sel;
    const groups = G.map(([label, opts]) => ({
      label,
      chips: opts.map(o => {
        const k = label + ':' + o, on = !!sel[k];
        return { label: o, on, bg: on ? '#15171A' : '#FFFFFF', fg: on ? '#FFFFFF' : '#15171A', border: on ? '#15171A' : '#E2E0D8', w: on ? 600 : 400, pick: () => this.setState({ sel: { ...sel, [k]: !on } }) };
      })
    }));
    const n = Object.values(sel).filter(Boolean).length;
    return { groups, count: n ? Math.max(2, 18 - n * 5) : 164, clearOpacity: n ? 1 : 0.4, clear: () => this.setState({ sel: {} }) };
  }
}
</script>
</body>
</html>
