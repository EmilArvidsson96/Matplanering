<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Planera – Schema</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
input::placeholder{color:#8A8E94}
button{font-family:inherit;cursor:pointer}
.step:hover{color:#15171A}
.add:hover{background:#DDF3E4}
</style>
</helmet>
<div style="width: 390px; min-height: 1700px; background: #F5F4EF; color: #15171A; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased">

  <header style="padding: 20px 20px 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 13px; font-weight: 500; color: #5C6066">21 nov – 28 nov</div>
      <h1 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1">Vecka 47</h1>
    </div>
    <div style="display: flex; gap: 8px">
      <button aria-label="Föregående vecka" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E0D8; color: #15171A; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="chevron-left" size="20" hint-size="20px,20px"></dc-import></button>
      <button aria-label="Nästa vecka" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E0D8; color: #15171A; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="chevron-right" size="20" hint-size="20px,20px"></dc-import></button>
    </div>
  </header>

  <main style="padding: 0 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <nav aria-label="Planeringssteg" style="height: 48px; border-radius: 999px; background: #EEEDE7; padding: 4px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
      <a class="step" href="PlaneraPortioner.dc.html" style="border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500; color: #5C6066"><span style="width: 20px; height: 20px; border-radius: 999px; background: #E2E0D8; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span>Portioner</a>
      <a class="step" href="PlaneraBrainstorm.dc.html" style="border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500; color: #5C6066"><span style="width: 20px; height: 20px; border-radius: 999px; background: #E2E0D8; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>Brainstorm</a>
      <a href="PlaneraSchema.dc.html" aria-current="page" style="border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600"><span style="width: 20px; height: 20px; border-radius: 999px; background: #15171A; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span>Schema</a>
    </nav>

    <section style="background: #FFFFFF; border-radius: 24px; padding: 20px">
      <h2 style="margin: 0 0 12px; font-family: Manrope, Inter, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Planeringsfönster</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <label style="font-size: 13px; font-weight: 600; color: #5C6066">Från<input type="date" value="2026-11-21" style="display: block; margin-top: 6px; width: 100%; box-sizing: border-box; height: 48px; border-radius: 16px; border: 1px solid #E2E0D8; padding: 0 10px; font-size: 15px; font-family: inherit; color: #15171A; background: #FFFFFF"></label>
        <label style="font-size: 13px; font-weight: 600; color: #5C6066">Till<input type="date" value="2026-11-28" style="display: block; margin-top: 6px; width: 100%; box-sizing: border-box; height: 48px; border-radius: 16px; border: 1px solid #E2E0D8; padding: 0 10px; font-size: 15px; font-family: inherit; color: #15171A; background: #FFFFFF"></label>
      </div>
    </section>

    <div style="padding: 0 4px; display: flex; flex-wrap: wrap; column-gap: 16px; row-gap: 4px; font-size: 12px; color: #5C6066">
      <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 999px; background: #5AAE7E"></span>Portioner räcker</span>
      <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 999px; background: #FBBF24"></span>Knappt</span>
      <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 999px; background: #F87171"></span>Portioner saknas</span>
    </div>

    <sc-for list="{{days}}" as="day" hint-placeholder-count="8">
      <section style="background: #FFFFFF; border-radius: 24px; overflow: hidden">
        <div style="padding: 14px 16px 4px; font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: 15px">{{day.label}}</div>
        <sc-for list="{{day.slots}}" as="s" hint-placeholder-count="2">
          <div style="padding: 12px 16px; border-top: {{s.border}}; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; align-items: center; gap: 10px">
              <span style="width: 8px; height: 8px; border-radius: 999px; background: {{s.dot}}"></span>
              <span style="font-size: 15px; font-weight: 600; flex: 1">{{s.type}}</span>
              <span style="font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid {{s.pillBorder}}; background: {{s.pillBg}}; color: {{s.pillFg}}">{{s.bal}}</span>
              <button aria-label="Färre portioner" style="width: 36px; height: 36px; border-radius: 999px; background: #EEEDE7; border: 0; font-weight: 700; color: #15171A">−</button>
              <span style="width: 24px; text-align: center; font-family: Manrope, Inter, sans-serif; font-weight: 800">{{s.need}}</span>
              <button aria-label="Fler portioner" style="width: 36px; height: 36px; border-radius: 999px; background: #EEEDE7; border: 0; font-weight: 700; color: #15171A">+</button>
            </div>
            <div style="padding-left: 18px; display: flex; flex-wrap: wrap; gap: 6px">
              <sc-for list="{{s.meals}}" as="m" hint-placeholder-count="1">
                <span style="font-size: 13px; padding: 0 4px 0 12px; height: 32px; border-radius: 999px; border: 1px solid {{m.border}}; background: {{m.bg}}; color: {{m.fg}}; display: inline-flex; align-items: center; gap: 4px">{{m.name}} <span style="color: #5C6066">{{m.part}}</span><button aria-label="Ta bort tilldelning" style="width: 24px; height: 24px; border-radius: 999px; border: 0; background: transparent; color: inherit">✕</button></span>
              </sc-for>
              <a class="add" href="Tilldela.dc.html" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px dashed rgba(138,142,148,0.6); font-size: 13px; font-weight: 600; color: #16503A; display: inline-flex; align-items: center">+ Lägg till matlagning</a>
            </div>
            <input aria-label="Notering" placeholder="Notering…" value="{{s.note}}" style="margin-left: 18px; border: 0; background: transparent; font-size: 13px; color: #5C6066; font-family: inherit">
          </div>
        </sc-for>
      </section>
    </sc-for>

    <section style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <span style="font-size: 14px; color: #16503A; font-weight: 500; display: inline-flex; align-items: center; gap: 6px"><dc-import name="Icon" icon="check-circle" size="16" hint-size="16px,16px"></dc-import>Alla måltider är tilldelade</span>
      <a href="Main.dc.html" style="padding: 10px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #1F6B45; color: #FFFFFF; display: inline-flex; align-items: center; gap: 4px; text-align: center">Klar – tillbaka till sammanfattning <dc-import name="Icon" icon="chevron-right" size="16" hint-size="16px,16px"></dc-import></a>
    </section>
  </main>

  <div style="position: sticky; bottom: 0; margin-top: auto; z-index: 5">
    <dc-import name="TabBar" active="vecka" hint-size="390px,104px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    const S = (type, need, meals, bal, note) => ({ type, need, meals, bal, note: note || '' });
    const M = (name, part, rest) => ({ name, part: part || '', rest: !!rest });
    const raw = [
      { label: 'Lör 21/11', slots: [S('Middag', 4, [M('Tacos')], 2, 'Farmor äter med')] },
      { label: 'Sön 22/11', slots: [S('Lunch', 2, [M('Tacos', '(2p)')], 0), S('Middag', 2, [M('Butter chicken')], 0)] },
      { label: 'Mån 23/11', slots: [S('Middag', 2, [M('Fiskpinnar med potatismos')], 0)] },
      { label: 'Tis 24/11', slots: [S('Middag', 2, [M('Köttfärssås med spagetti')], 2)] },
      { label: 'Ons 25/11', slots: [S('Middag', 2, [M('Shakshuka')], 0)] },
      { label: 'Tor 26/11', slots: [S('Middag', 2, [M('Grön curry med ris')], 1)] },
      { label: 'Fre 27/11', slots: [S('Lunch', 1, [M('Rester', '', true)], 1), S('Middag', 3, [M('Lasagne')], 0, 'Fotbollsträning 18')] },
      { label: 'Lör 28/11', slots: [S('Lunch', 2, [M('Rester', '', true)], -1)] }
    ];
    const tone = b => b < 0
      ? { dot: '#F87171', pillBg: '#FEE2E2', pillFg: '#B91C1C', pillBorder: '#FECACA' }
      : b <= 1
        ? { dot: '#FBBF24', pillBg: '#FEF3C7', pillFg: '#B45309', pillBorder: '#FDE68A' }
        : { dot: '#5AAE7E', pillBg: '#DDF3E4', pillFg: '#16503A', pillBorder: '#BFE3CC' };
    const days = raw.map(d => ({
      ...d,
      slots: d.slots.map((s, i) => ({
        ...s, ...tone(s.bal),
        bal: s.bal > 0 ? '+' + s.bal : String(s.bal),
        border: i === 0 ? '0' : '1px solid #EEEDE7',
        meals: s.meals.map(m => ({
          ...m,
          bg: m.rest ? '#FFFBEB' : '#F5F4EF',
          border: m.rest ? '#FDE68A' : '#E2E0D8',
          fg: m.rest ? '#92400E' : '#15171A'
        }))
      }))
    }));
    return { days };
  }
}
</script>
</body>
</html>
