<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Bibliotek – desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;background:#F5F4EF}
a{color:inherit;text-decoration:none}
input::placeholder{color:#8A8E94}
button,select{font-family:inherit;cursor:pointer}
.card:hover{box-shadow:0 6px 20px rgba(21,23,26,0.08)}
</style>
</helmet>
<div style="min-height: 1100px; background: #F5F4EF; color: #15171A; font-family: Inter, system-ui, sans-serif; display: flex; flex-wrap: wrap; -webkit-font-smoothing: antialiased">
  <div style="flex: 0 0 240px"><dc-import name="SideNav" active="bibliotek" hint-size="240px,900px"></dc-import></div>
  <div style="flex: 999 1 560px; min-width: 0; padding: 12px 12px 12px 0">
    <main style="max-width: 1152px; padding: 20px 20px 48px; box-sizing: border-box">
      <header style="margin-bottom: 28px"><h1 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-size: 44px; font-weight: 800; letter-spacing: -0.02em; line-height: 1">Bibliotek</h1></header>
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; gap: 8px; align-items: center">
          <label style="position: relative; flex: 1; display: block">
            <span style="position: absolute; left: 16px; top: 15px; color: #5C6066"><dc-import name="Icon" icon="search" size="18" hint-size="18px,18px"></dc-import></span>
            <input aria-label="Sök rätt…" placeholder="Sök rätt…" style="width: 100%; box-sizing: border-box; height: 48px; border-radius: 999px; border: 1px solid #E2E0D8; background: #FFFFFF; padding: 0 16px 0 44px; font-size: 16px; font-family: inherit">
          </label>
          <a href="DRattEditor.dc.html" style="height: 48px; padding: 0 16px; border-radius: 999px; background: #15171A; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap"><dc-import name="Icon" icon="plus" size="16" sw="2.5" hint-size="16px,16px"></dc-import>Ny rätt</a>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <a href="Filter.dc.html" style="height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; border: 1px solid {{fBorder}}; background: {{fBg}}; color: {{fFg}}"><dc-import name="Icon" icon="sliders" size="16" hint-size="16px,16px"></dc-import>{{filterLabel}}</a>
          <label style="height: 40px; padding: 0 8px 0 16px; border-radius: 999px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; border: 1px solid #E2E0D8; background: #FFFFFF"><dc-import name="Icon" icon="sort" size="16" hint-size="16px,16px"></dc-import><select aria-label="Sortering" style="border: 0; background: transparent; font-size: 14px; font-weight: 500; appearance: none; -webkit-appearance: none"><option>A–Ö</option><option>Populärast</option><option>Säsong</option></select></label>
          <span style="width: 1px; background: #E2E0D8; margin: 8px 0"></span>
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
            <button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-weight: {{c.w}}">{{c.label}}</button>
          </sc-for>
        </div>
        <div style="font-size: 13px; color: #5C6066; padding: 0 4px">{{countLabel}}</div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px">
          <sc-for list="{{dishes}}" as="d" hint-placeholder-count="12">
            <a class="card" href="DRattEditor.dc.html" style="background: #FFFFFF; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .2s">
              <div style="height: 96px; position: relative; display: flex; align-items: center; justify-content: center; background: {{d.bg}}; color: {{d.fg}}">
                <span style="font-family: Manrope, Inter, sans-serif; font-size: 30px; font-weight: 800; opacity: 0.85">{{d.letter}}</span>
                <sc-if value="{{d.cooked}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 8px; right: 8px; font-size: 11px; font-weight: 600; background: rgba(255,255,255,0.7); border-radius: 999px; padding: 2px 6px">×{{d.times}}</span></sc-if>
                <sc-if value="{{d.url}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 8px; left: 8px; opacity: 0.6"><dc-import name="Icon" icon="link" size="14" hint-size="14px,14px"></dc-import></span></sc-if>
              </div>
              <div style="padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 4px">
                <h3 style="margin: 0; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; line-height: 1.35">{{d.name}}</h3>
                <div style="font-size: 12px; color: #5C6066">{{d.meta}}</div>
                <div style="display: flex; flex-wrap: wrap; gap: 4px"><sc-for list="{{d.tags}}" as="t" hint-placeholder-count="1"><span style="font-size: 11px; background: #F5F4EF; color: #3D4046; padding: 2px 6px; border-radius: 999px">{{t}}</span></sc-for></div>
              </div>
            </a>
          </sc-for>
        </div>
        <div style="display: flex; justify-content: center; padding-top: 8px"><button style="height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: transparent; font-size: 13px; font-weight: 500; color: #5C6066; display: inline-flex; align-items: center; gap: 6px"><dc-import name="Icon" icon="download" size="14" hint-size="14px,14px"></dc-import>Exportera bibliotek</button></div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { prot: {} }; }
  renderVals() {
    const C = { vegetarisk: ['#DDF3E4', '#0F4A2E'], vegan: ['#E2EDD3', '#2F4A12'], fisk: ['#DCE8F5', '#173A63'], skaldjur: ['#D9EEF0', '#114B52'], kyckling: ['#F6E0C8', '#6B3A0B'], nöt: ['#FCE3D6', '#7A2E12'], fläsk: ['#FBE1E4', '#7A1F2B'], lamm: ['#EEE3F5', '#4B2463'], vilt: ['#EAE4D8', '#4A3B1E'] };
    const all = [
      { name: 'Biff Rydberg', p: 'nöt', meta: 'Svensk · lagad 2026-05', times: 2, tags: ['Festlig'] },
      { name: 'Boeuf Bourguignon', p: 'nöt', meta: 'Gryta · lagad 2026-01', times: 1, tags: ['Festlig'], url: true },
      { name: 'Butter chicken', p: 'kyckling', meta: 'Gryta · lagad 2026-11', times: 6, tags: [], url: true },
      { name: 'Carbonara', p: 'fläsk', meta: 'Italiensk · lagad 2026-10', times: 7, tags: [] },
      { name: 'Falafel med hummus och ris', p: 'vegan', meta: 'Mellanöstern', tags: [] },
      { name: 'Fiskpinnar med potatismos', p: 'fisk', meta: 'Svensk · lagad 2026-11', times: 4, tags: ['Barnvänlig', 'Snabb'] },
      { name: 'Glasnudelsallad med räkor', p: 'skaldjur', meta: 'Sallad', tags: ['Snabb'] },
      { name: 'Grön curry', p: 'kyckling', meta: 'Gryta · lagad 2026-11', times: 5, tags: ['Stark'], url: true },
      { name: 'Köttfärssås med spagetti', p: 'nöt', meta: 'Italiensk · lagad 2026-11', times: 9, tags: ['Barnvänlig'] },
      { name: 'Lammfärsbiffar med tzatziki', p: 'lamm', meta: 'Mellanöstern · lagad 2026-04', times: 1, tags: [] },
      { name: 'Renskavsgryta', p: 'vilt', meta: 'Gryta · lagad 2025-12', times: 1, tags: ['Festlig'] },
      { name: 'Shakshuka', p: 'vegetarisk', meta: 'Mellanöstern · lagad 2026-11', times: 4, tags: ['Snabb'] },
      { name: 'Tacos', p: 'nöt', meta: 'Taco · lagad 2026-11', times: 11, tags: ['Barnvänlig'] },
      { name: 'Ugnsfalukorv', p: 'fläsk', meta: 'Svensk', tags: ['Snabb', 'Barnvänlig'] },
      { name: 'Citronpasta', p: 'vegetarisk', meta: 'Italiensk · lagad 2026-09', times: 3, tags: ['Snabb'] },
      { name: 'Fiskgratäng', p: 'fisk', meta: 'Svensk · lagad 2026-09', times: 3, tags: [] }
    ];
    const prot = this.state.prot;
    const active = Object.keys(prot).filter(k => prot[k]);
    const chips = [['Vegetarisk', 'vegetarisk'], ['Fisk', 'fisk'], ['Kyckling', 'kyckling'], ['Nöt', 'nöt'], ['Fläsk', 'fläsk']].map(([label, key]) => {
      const on = !!prot[key];
      return { label, on, bg: on ? '#15171A' : '#FFFFFF', fg: on ? '#FFFFFF' : '#15171A', border: on ? '#15171A' : '#E2E0D8', w: on ? 600 : 400, pick: () => this.setState({ prot: { ...prot, [key]: !on } }) };
    });
    const dishes = all.filter(d => !active.length || active.includes(d.p)).map(d => ({ ...d, letter: d.name[0], bg: C[d.p][0], fg: C[d.p][1], cooked: !!d.times, times: d.times || 0, url: !!d.url }));
    const n = active.length;
    return { chips, dishes, countLabel: n ? dishes.length + ' av 164 rätter' : '164 rätter', filterLabel: n ? 'Filter · ' + n : 'Filter', fBg: n ? '#15171A' : '#FFFFFF', fFg: n ? '#FFFFFF' : '#15171A', fBorder: n ? '#15171A' : '#E2E0D8' };
  }
}
</script>
</body>
</html>
