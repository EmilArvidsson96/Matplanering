<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Redigera rätt – desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;background:#8B8A86}
a{color:inherit;text-decoration:none}
input::placeholder,textarea::placeholder{color:#8A8E94}
button,select{font-family:inherit;cursor:pointer}
.cell{height:40px;width:100%;min-width:0;box-sizing:border-box;border-radius:10px;background:#F5F4EF;border:1px solid transparent;padding:0 10px;font-size:14px;color:#15171A;font-family:inherit}
.tn:hover{background:#FFFFFF}
.lbl{display:block;font-size:13px;font-weight:600;color:#5C6066;margin-bottom:6px}
</style>
</helmet>
<div style="min-height: 900px; background: #8B8A86; font-family: Inter, system-ui, sans-serif; color: #15171A; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; position: relative; -webkit-font-smoothing: antialiased">
  <a href="DBibliotek.dc.html" aria-label="Stäng" style="position: absolute; inset: 0"></a>
  <div role="dialog" aria-label="Redigera rätt" style="position: relative; width: 100%; max-width: 896px; max-height: 792px; background: #F5F4EF; border-radius: 32px; box-shadow: 0 25px 50px rgba(0,0,0,0.25); display: flex; flex-direction: column">
    <div style="padding: 24px 28px 16px; display: flex; align-items: center; gap: 12px">
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 13px; font-weight: 500; color: #5C6066">Redigera rätt</div>
        <h2 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Butter chicken</h2>
      </div>
      <a href="DBibliotek.dc.html" aria-label="Stäng" style="width: 40px; height: 40px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E0D8; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="x" size="18" hint-size="18px,18px"></dc-import></a>
    </div>
    <div style="flex: 1; overflow-y: auto; padding: 0 28px 24px">
      <div style="display: flex; gap: 20px; min-height: 520px; flex-wrap: wrap">
        <nav aria-label="Flikar" style="width: 208px; display: flex; flex-direction: column; gap: 4px">
          <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
            <button class="{{t.cls}}" onClick="{{t.pick}}" aria-current="{{t.current}}" style="height: 48px; padding: 0 16px; border-radius: 999px; font-size: 14px; text-align: left; display: flex; align-items: center; justify-content: space-between; border: 0; background: {{t.bg}}; color: {{t.fg}}; font-weight: {{t.w}}">{{t.label}}<span style="color: {{t.countColor}}">{{t.count}}</span></button>
          </sc-for>
        </nav>
        <div style="flex: 999 1 480px; min-width: 0; background: #FFFFFF; border-radius: 24px; padding: 24px">
          <sc-if value="{{grund}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; flex-direction: column; gap: 24px">
              <label><span class="lbl">Namn</span><input value="Butter chicken" placeholder="T.ex. Linsgryta" style="width: 100%; box-sizing: border-box; height: 48px; border-radius: 16px; border: 1px solid #E2E0D8; padding: 0 16px; font-size: 17px; font-weight: 600; font-family: inherit"></label>
              <sc-for list="{{chipGroups}}" as="g" hint-placeholder-count="3">
                <div><span class="lbl">{{g.label}}</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{g.chips}}" as="c" hint-placeholder-count="6"><button style="height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-weight: {{c.w}}">{{c.label}}</button></sc-for></div></div>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ingr}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; flex-direction: column; gap: 16px">
              <div style="padding: 6px 6px 6px 16px; display: flex; align-items: center; gap: 8px; border-radius: 24px; background: #F5F4EF">
                <span style="color: #5C6066"><dc-import name="Icon" icon="link" size="18" hint-size="18px,18px"></dc-import></span>
                <input type="url" aria-label="Receptlänk" placeholder="Klistra in receptlänk" value="https://www.ica.se/recept/butter-chicken" style="flex: 1; min-width: 0; height: 40px; border: 0; background: transparent; font-size: 16px; font-family: inherit">
                <button style="height: 40px; padding: 0 16px; border-radius: 999px; background: #DDF3E4; color: #0F4A2E; border: 0; font-weight: 600; font-size: 14px">Hämta ingredienser</button>
              </div>
              <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 0 4px">
                <span style="font-size: 13px; font-weight: 600; color: #5C6066">8 ingredienser</span>
                <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #5C6066">Receptet gäller
                  <span style="display: flex; align-items: center; background: #FFFFFF; border: 1px solid #E2E0D8; border-radius: 999px; padding: 2px"><button aria-label="Färre" style="width: 36px; height: 36px; border-radius: 999px; border: 0; background: transparent">−</button><span style="width: 40px; text-align: center; font-family: Manrope, Inter, sans-serif; font-weight: 800; color: #15171A">4</span><button aria-label="Fler" style="width: 36px; height: 36px; border-radius: 999px; border: 0; background: transparent">+</button></span>
                  <input aria-label="Enhet" placeholder="port." style="width: 80px; height: 40px; border-radius: 999px; border: 1px solid #E2E0D8; padding: 0 12px; font-size: 14px; font-family: inherit; box-sizing: border-box">
                </span>
              </div>
              <div style="border: 1px solid #EEEDE7; border-radius: 24px; overflow: hidden">
                <div style="display: grid; grid-template-columns: 2fr 90px 100px 1.3fr 44px; gap: 10px; padding: 10px 16px; background: rgba(245,244,239,0.6); font-size: 12px; font-weight: 600; color: #5C6066"><span>Ingrediens</span><span>Mängd</span><span>Enhet</span><span>Kategori</span><span></span></div>
                <sc-for list="{{ingList}}" as="i" hint-placeholder-count="8">
                  <div style="display: grid; grid-template-columns: 2fr 90px 100px 1.3fr 44px; gap: 10px; padding: 8px 16px; border-top: 1px solid #EEEDE7; align-items: center">
                    <input class="cell" aria-label="Ingrediens" value="{{i.name}}">
                    <input class="cell" aria-label="Mängd" value="{{i.a}}" style="text-align: right">
                    <input class="cell" aria-label="Enhet" value="{{i.u}}">
                    <select class="cell" aria-label="Kategori"><option>{{i.cat}}</option></select>
                    <button aria-label="Ta bort" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: transparent; color: #8A8E94; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="x" size="16" hint-size="16px,16px"></dc-import></button>
                  </div>
                </sc-for>
              </div>
              <button style="align-self: flex-start; height: 48px; padding: 0 20px; border-radius: 24px; border: 1.5px dashed rgba(138,142,148,0.6); background: transparent; font-weight: 600; font-size: 15px; color: #15171A; display: flex; align-items: center; gap: 6px"><dc-import name="Icon" icon="plus" size="18" hint-size="18px,18px"></dc-import>Lägg till ingrediens</button>
            </div>
          </sc-if>
          <sc-if value="{{steg}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; flex-direction: column; gap: 12px">
              <sc-for list="{{stepList}}" as="s" hint-placeholder-count="5">
                <div style="padding: 12px; display: flex; gap: 12px; align-items: flex-start; border-radius: 24px; background: #F5F4EF">
                  <span style="width: 28px; height: 28px; margin-top: 6px; border-radius: 999px; background: #15171A; color: #FFFFFF; font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{s.n}}</span>
                  <textarea aria-label="Steg {{s.n}}" rows="2" style="flex: 1; min-width: 0; border-radius: 12px; border: 0; background: #FFFFFF; padding: 8px 12px; font-size: 16px; line-height: 1.6; font-family: inherit; resize: none">{{s.t}}</textarea>
                </div>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{mer}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; flex-direction: column; gap: 24px">
              <div><span class="lbl">Säsong <span style="font-weight: 400; margin-left: 8px">(vanligast i historiken: Nov)</span></span>
                <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px"><sc-for list="{{months}}" as="m" hint-placeholder-count="12"><button style="height: 44px; border-radius: 12px; font-size: 13px; border: 1px solid {{m.border}}; background: {{m.bg}}; color: {{m.fg}}; font-weight: {{m.w}}">{{m.label}}</button></sc-for></div>
              </div>
              <label><span class="lbl">Anteckningar</span><textarea rows="4" style="width: 100%; box-sizing: border-box; border-radius: 16px; border: 1px solid #E2E0D8; padding: 12px 16px; font-size: 16px; font-family: inherit; resize: none">• Servera med naan: Värm naanbröd i ugnen sista fem minuterna.</textarea></label>
            </div>
          </sc-if>
        </div>
      </div>
    </div>
    <div style="border-top: 1px solid #EEEDE7; padding: 16px 28px; display: flex; justify-content: space-between; align-items: center; gap: 12px">
      <a href="DBibliotek.dc.html" style="height: 44px; padding: 0 16px; border-radius: 999px; color: #B91C1C; font-weight: 600; font-size: 14px; display: flex; align-items: center">Ta bort rätten</a>
      <div style="display: flex; gap: 10px">
        <a href="DBibliotek.dc.html" style="height: 48px; padding: 0 20px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E0D8; font-weight: 600; font-size: 15px; display: flex; align-items: center">Avbryt</a>
        <a href="DBibliotek.dc.html" style="height: 48px; padding: 0 28px; border-radius: 999px; background: #1F6B45; color: #FFFFFF; font-weight: 600; font-size: 15px; display: flex; align-items: center">Spara</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'ingr' }; }
  renderVals() {
    const t = this.state.tab;
    const tabs = [['grund', 'Grund', ''], ['ingr', 'Ingredienser', '8'], ['steg', 'Gör så här', '5'], ['mer', 'Säsong & anteckningar', '']].map(([id, label, count]) => {
      const on = id === t;
      return { label, count, current: on ? 'true' : 'false', cls: on ? '' : 'tn', bg: on ? '#15171A' : 'transparent', fg: on ? '#FFFFFF' : '#3D4046', w: on ? 600 : 500, countColor: on ? '#B5F0C9' : '#5C6066', pick: () => this.setState({ tab: id }) };
    });
    const chip = (label, sel) => ({ label, border: sel ? '#15171A' : '#E2E0D8', bg: sel ? '#15171A' : '#FFFFFF', fg: sel ? '#FFFFFF' : '#15171A', w: sel ? 600 : 400 });
    const chipGroups = [
      { label: 'Protein', chips: ['Kyckling', 'Nöt', 'Fläsk', 'Fisk', 'Skaldjur', 'Lamm', 'Vilt', 'Vegetarisk', 'Vegan'].map(l => chip(l, l === 'Kyckling')) },
      { label: 'Kolhydrat', chips: ['Ris', 'Pasta', 'Potatis', 'Nudlar', 'Bröd', 'Lågkolhydrat'].map(l => chip(l, l === 'Ris')) },
      { label: 'Taggar', chips: ['Snabb', 'Festlig', 'Barnvänlig', 'Low FODMAP', 'LCHF', 'Stark', 'Låg fetthalt'].map(l => chip(l, false)) }
    ];
    const ingList = [['Kycklingfilé', '600', 'g', 'Kött'], ['Gul lök', '1', 'st', 'Grönsaker'], ['Vitlök', '3', 'klyftor', 'Grönsaker'], ['Krossade tomater', '400', 'g', 'Konserver'], ['Grädde', '2', 'dl', 'Mejeri'], ['Smör', '30', 'g', 'Mejeri'], ['Garam masala', '2', 'tsk', 'Kryddor'], ['Basmatiris', '3', 'dl', 'Torrvaror']].map(([name, a, u, cat]) => ({ name, a, u, cat }));
    const stepList = ['Skär kycklingfilé i bitar och marinera med garam masala.', 'Fräs gul lök och vitlök i smör.', 'Tillsätt krossade tomater och grädde, låt puttra 15 min.', 'Lägg i kycklingen och sjud tills genomstekt.', 'Servera med basmatiris.'].map((tx, i) => ({ n: i + 1, t: tx }));
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Maj', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dec'].map((label, i) => { const s = [0, 1, 9, 10, 11].includes(i); return { label, bg: s ? '#1F6B45' : '#FFFFFF', fg: s ? '#FFFFFF' : '#15171A', border: s ? '#1F6B45' : '#E2E0D8', w: s ? 600 : 400 }; });
    return { tabs, grund: t === 'grund', ingr: t === 'ingr', steg: t === 'steg', mer: t === 'mer', chipGroups, ingList, stepList, months };
  }
}
</script>
</body>
</html>
