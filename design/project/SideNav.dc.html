<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Sidomeny</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>body{margin:0}a{text-decoration:none}.ni:hover{background:#FFFFFF}.lo:hover{color:#15171A}</style>
</helmet>
<aside style="width: 240px; min-height: 900px; height: 100%; box-sizing: border-box; padding: 28px 16px; display: flex; flex-direction: column; gap: 4px; background: #F5F4EF; color: #15171A; font-family: Inter, system-ui, sans-serif">
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 12px 24px">
    <span style="width: 32px; height: 32px; border-radius: 10px; background: #1F6B45; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="utensils" size="18" hint-size="18px,18px"></dc-import></span>
    <span style="font-family: Manrope, Inter, sans-serif; font-size: 18px; font-weight: 800; letter-spacing: -0.02em">Matplanering</span>
  </div>
  <nav aria-label="Huvudmeny" style="display: flex; flex-direction: column; gap: 4px">
    <sc-for list="{{primary}}" as="n" hint-placeholder-count="4">
      <a class="{{n.cls}}" href="{{n.href}}" aria-current="{{n.current}}" style="height: 44px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; gap: 12px; font-size: 14px; background: {{n.bg}}; color: {{n.fg}}; font-weight: {{n.w}}"><dc-import name="Icon" icon="{{n.icon}}" size="18" hint-size="18px,18px"></dc-import>{{n.label}}</a>
    </sc-for>
    <div style="height: 1px; background: #E2E0D8; margin: 12px"></div>
    <sc-for list="{{secondary}}" as="n" hint-placeholder-count="3">
      <a class="{{n.cls}}" href="{{n.href}}" aria-current="{{n.current}}" style="height: 44px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; gap: 12px; font-size: 14px; background: {{n.bg}}; color: {{n.fg}}; font-weight: {{n.w}}"><dc-import name="Icon" icon="{{n.icon}}" size="18" hint-size="18px,18px"></dc-import>{{n.label}}</a>
    </sc-for>
  </nav>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding: 0 14px">
    <a href="Feedback.dc.html" aria-label="Ge feedback" style="width: 48px; height: 48px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E0D8; box-shadow: 0 4px 16px rgba(21,23,26,0.10); color: #15171A; display: flex; align-items: center; justify-content: center; margin-left: -2px"><dc-import name="Icon" icon="message" size="20" hint-size="20px,20px"></dc-import></a>
    <span style="font-size: 12px; color: #5C6066">Sparat ✓</span>
    <a class="lo" href="Login.dc.html" style="font-size: 12px; color: #5C6066; display: flex; align-items: center; gap: 6px"><dc-import name="Icon" icon="logout" size="14" hint-size="14px,14px"></dc-import>Logga ut</a>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"vecka","options":["vecka","recept","bibliotek","inkop","forrad","spel","inst"]},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'vecka';
    const mk = ([id, label, icon, href]) => {
      const on = id === a;
      return { id, label, icon, href, current: on ? 'page' : 'false', cls: on ? '' : 'ni', bg: on ? '#15171A' : 'transparent', fg: on ? '#FFFFFF' : '#3D4046', w: on ? 600 : 500 };
    };
    return {
      primary: [['vecka', 'Vecka', 'calendar', 'DVecka.dc.html'], ['recept', 'Recept', 'utensils', 'DRecept.dc.html'], ['bibliotek', 'Bibliotek', 'book', 'DBibliotek.dc.html'], ['inkop', 'Inköp', 'cart', 'DInkop.dc.html']].map(mk),
      secondary: [['forrad', 'Förråd', 'package', 'DForrad.dc.html'], ['spel', 'Spel', 'gamepad', 'DSpel.dc.html'], ['inst', 'Inställningar', 'settings', 'DInstallningar.dc.html']].map(mk)
    };
  }
}
</script>
</body>
</html>
