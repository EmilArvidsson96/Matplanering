<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Välj rätt från biblioteket</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
input::placeholder{color:#8A8E94}
button{font-family:inherit;cursor:pointer}
.row:hover{background:#EEF7F1}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #8B8A86; font-family: Inter, system-ui, sans-serif; color: #15171A; -webkit-font-smoothing: antialiased">
  <a href="PlaneraBrainstorm.dc.html" aria-label="Stäng" style="position: absolute; inset: 0"></a>
  <div role="dialog" aria-label="Välj rätt från biblioteket" style="position: absolute; left: 0; right: 0; bottom: 0; height: 793px; background: #F5F4EF; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 32px rgba(0,0,0,0.18); display: flex; flex-direction: column">
    <div style="padding: 8px 20px 12px">
      <div style="display: flex; justify-content: center; padding-bottom: 8px"><span style="width: 40px; height: 5px; border-radius: 999px; background: #E2E0D8"></span></div>
      <div style="display: flex; align-items: center; gap: 12px">
        <h2 style="flex: 1; margin: 0; font-family: Manrope, Inter, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.02em">Välj rätt från biblioteket</h2>
        <a href="PlaneraBrainstorm.dc.html" aria-label="Stäng" style="width: 40px; height: 40px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E0D8; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="x" size="18" hint-size="18px,18px"></dc-import></a>
      </div>
    </div>
    <div style="flex: 1; overflow-y: auto; padding: 0 16px 24px">
      <div style="display: flex; gap: 8px; margin-bottom: 12px">
        <input aria-label="Sök rätt" placeholder="Sök rätt…" style="flex: 1; min-width: 0; height: 48px; border-radius: 16px; border: 1px solid #E2E0D8; background: #FFFFFF; padding: 0 16px; font-size: 16px; font-family: inherit">
        <select aria-label="Sortering" style="height: 48px; border-radius: 16px; border: 1px solid #E2E0D8; background: #FFFFFF; padding: 0 12px; font-size: 15px; font-family: inherit"><option>A–Ö</option><option>Populärast</option><option>Säsong</option></select>
      </div>
      <div style="border: 1px solid #EEEDE7; border-radius: 12px; overflow: hidden; margin-bottom: 12px">
        <button style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; font-size: 14px; background: #F5F4EF; border: 0"><span style="font-weight: 500; color: #5C6066">Protein</span><span style="display: flex; gap: 6px; align-items: center"><span style="font-size: 12px; background: #1F6B45; color: #FFFFFF; padding: 2px 6px; border-radius: 999px">1</span><span style="font-size: 12px; color: #8A8E94">▲</span></span></button>
        <div style="padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px; background: #FFFFFF">
          <sc-for list="{{proteins}}" as="p" hint-placeholder-count="9">
            <button onClick="{{p.pick}}" style="font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font-weight: 500">{{p.label}}</button>
          </sc-for>
        </div>
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
          <button style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; font-size: 14px; background: #F5F4EF; border: 0; border-top: 1px solid #EEEDE7"><span style="font-weight: 500; color: #5C6066">{{g}}</span><span style="font-size: 12px; color: #8A8E94">▼</span></button>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding: 0 4px">
        <button style="border: 0; background: transparent; font-size: 12px; color: #B91C1C; padding: 0">Rensa 1 filter</button>
        <span style="font-size: 12px; color: #8A8E94">{{count}} rätter</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{dishes}}" as="d" hint-placeholder-count="8">
          <a class="row" href="PlaneraBrainstorm.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; opacity: {{d.opacity}}">
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 14px; font-weight: 500">{{d.name}}</div>
              <div style="font-size: 12px; color: #8A8E94">{{d.meta}}<span style="color: #D97706">{{d.warn}}</span></div>
            </div>
            <span style="font-size: 12px; color: #8A8E94">{{d.pop}}</span>
            <span style="font-size: 12px; color: #2F8A5A">{{d.added}}</span>
          </a>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { protein: 'Kyckling' }; }
  renderVals() {
    const P = ['Kyckling', 'Nöt', 'Fläsk', 'Fisk', 'Skaldjur', 'Lamm', 'Vilt', 'Vegetarisk', 'Vegan'];
    const proteins = P.map(label => {
      const on = this.state.protein === label;
      return { label, bg: on ? '#1F6B45' : '#FFFFFF', fg: on ? '#FFFFFF' : '#5C6066', border: on ? '#1F6B45' : '#E2E0D8', pick: () => this.setState({ protein: on ? null : label }) };
    });
    const all = [
      { name: 'Butter chicken', meta: 'kyckling · ris · 2026-11', pop: '×6', added: 'Tillagd', p: 'Kyckling' },
      { name: 'Caesarsallad med kyckling', meta: 'kyckling · bröd · 2026-09', pop: '×3', p: 'Kyckling' },
      { name: 'Ciderkyckling med amandinepotatis', meta: 'kyckling · potatis', pop: '', warn: ' · ⚠️ inga ingredienser', p: 'Kyckling' },
      { name: 'Dragonkyckling', meta: 'kyckling · ris · 2026-08', pop: '×2', p: 'Kyckling' },
      { name: 'Drunken noodles', meta: 'kyckling · nudlar · 2026-10', pop: '×4', p: 'Kyckling' },
      { name: 'Enchiladas', meta: 'kyckling · bröd · 2026-06', pop: '×2', p: 'Kyckling' },
      { name: 'Grön curry', meta: 'kyckling · ris · 2026-11', pop: '×5', added: 'Tillagd', p: 'Kyckling' },
      { name: 'Biff Rydberg', meta: 'nöt · potatis · 2026-05', pop: '×2', p: 'Nöt' },
      { name: 'Boeuf Bourguignon', meta: 'nöt · potatis · 2026-01', pop: '×1', p: 'Nöt' },
      { name: 'Carbonara', meta: 'fläsk · pasta · 2026-10', pop: '×7', p: 'Fläsk' },
      { name: 'Fiskgratäng', meta: 'fisk · potatis · 2026-09', pop: '×3', p: 'Fisk' },
      { name: 'Shakshuka', meta: 'vegetarisk · bröd', pop: '×4', added: 'Tillagd', warn: ' · ⚠️ inga ingredienser', p: 'Vegetarisk' }
    ];
    const f = this.state.protein;
    const dishes = all.filter(d => !f || d.p === f).map(d => ({ ...d, warn: d.warn || '', added: d.added || '', opacity: d.added ? 0.5 : 1 }));
    return { proteins, groups: ['Kolhydrat', 'Kök', 'Typ', 'Taggar'], dishes, count: f ? dishes.length : 164 };
  }
}
</script>
</body>
</html>
