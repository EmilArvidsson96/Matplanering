<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Förbättringsförslag</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #8B8A86; font-family: Inter, system-ui, sans-serif; color: #15171A; -webkit-font-smoothing: antialiased">
  <a href="ReceptDetalj.dc.html" aria-label="Stäng" style="position: absolute; inset: 0"></a>
  <div role="dialog" aria-label="Förbättringsförslag" style="position: absolute; left: 0; right: 0; bottom: 0; background: #F5F4EF; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 32px rgba(0,0,0,0.18); display: flex; flex-direction: column">
    <div style="padding: 8px 20px 12px">
      <div style="display: flex; justify-content: center; padding-bottom: 8px"><span style="width: 40px; height: 5px; border-radius: 999px; background: #E2E0D8"></span></div>
      <div style="display: flex; align-items: center; gap: 12px">
        <h2 style="flex: 1; margin: 0; font-family: Manrope, Inter, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.02em">Förbättringsförslag</h2>
        <a href="ReceptDetalj.dc.html" aria-label="Stäng" style="width: 40px; height: 40px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E0D8; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="x" size="18" hint-size="18px,18px"></dc-import></a>
      </div>
    </div>
    <div style="background: #FFFFFF; border-radius: 24px 24px 0 0; display: flex; flex-direction: column">
      <div style="padding: 16px; display: flex; flex-direction: column; gap: 8px">
        <p style="margin: 0 0 4px; font-size: 12px; color: #5C6066">Bocka för de förslag du vill lägga till i receptets anteckningar. Förslagen sparas på receptet.</p>
        <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
          <label style="display: flex; gap: 10px; padding: 12px; border-radius: 12px; border: 1px solid {{it.border}}; background: {{it.bg}}; opacity: {{it.opacity}}; cursor: pointer">
            <input type="checkbox" checked="{{it.checked}}" disabled="{{it.applied}}" onChange="{{it.toggle}}" style="accent-color: #2F8A5A; margin-top: 2px">
            <span style="flex: 1">
              <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
                <b style="font-size: 14px; font-weight: 600">{{it.title}}</b>
                <span style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: #1F6B45; background: #DDF3E4; border-radius: 4px; padding: 2px 6px">{{it.cat}}</span>
                <sc-if value="{{it.applied}}" hint-placeholder-val="{{false}}"><span style="font-size: 10px; color: #5C6066">Tillagd</span></sc-if>
              </span>
              <span style="display: block; font-size: 14px; color: #5C6066; margin-top: 2px">{{it.detail}}</span>
            </span>
          </label>
        </sc-for>
      </div>
      <div style="display: flex; gap: 8px; padding: 12px 16px 28px; border-top: 1px solid #E2E0D8">
        <button style="font-size: 14px; padding: 6px 12px; border: 1px solid #E2E0D8; border-radius: 8px; color: #5C6066; background: transparent; display: inline-flex; align-items: center; gap: 6px"><dc-import name="Icon" icon="refresh" size="14" hint-size="14px,14px"></dc-import>Nya förslag</button>
        <a href="ReceptDetalj.dc.html" style="margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; padding: 6px 12px; background: #2F8A5A; color: #FFFFFF; border-radius: 999px; opacity: {{addOpacity}}"><dc-import name="Icon" icon="check" size="14" hint-size="14px,14px"></dc-import>{{addLabel}}</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: { 0: true, 1: true } }; }
  renderVals() {
    const raw = [
      { title: 'Rosta kryddorna', cat: 'smak', detail: 'Rosta garam masala torrt i pannan innan löken så blir smaken djupare.' },
      { title: 'Vila köttet', cat: 'teknik', detail: 'Låt kycklingen vila i marinaden över natten om du hinner.' },
      { title: 'Byt halva grädden', cat: 'hälsa', detail: 'Ersätt hälften av grädden med matlagningsyoghurt för lägre fetthalt.' },
      { title: 'Servera med naan', cat: 'tillbehör', detail: 'Värm naanbröd i ugnen sista fem minuterna.', applied: true }
    ];
    const sel = this.state.sel;
    const items = raw.map((r, i) => {
      const checked = !!r.applied || !!sel[i];
      return {
        ...r, applied: !!r.applied, checked,
        border: r.applied ? '#EEEDE7' : checked ? '#8FCBA6' : '#E2E0D8',
        bg: r.applied ? '#F5F4EF' : checked ? '#EEF7F1' : '#FFFFFF',
        opacity: r.applied ? 0.6 : 1,
        toggle: () => this.setState({ sel: { ...sel, [i]: !sel[i] } })
      };
    });
    const n = raw.filter((r, i) => !r.applied && sel[i]).length;
    return { items, addLabel: n ? 'Lägg till (' + n + ')' : 'Lägg till', addOpacity: n ? 1 : 0.4 };
  }
}
</script>
</body>
</html>
