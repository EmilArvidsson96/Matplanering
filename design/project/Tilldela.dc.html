<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Tilldela matlagning</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.row:hover{background:#EEF7F1;border-color:#DDF3E4}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #8B8A86; font-family: Inter, system-ui, sans-serif; color: #15171A; -webkit-font-smoothing: antialiased">
  <a href="PlaneraSchema.dc.html" aria-label="Stäng" style="position: absolute; inset: 0"></a>
  <div role="dialog" aria-label="Tilldela matlagning" style="position: absolute; left: 0; right: 0; bottom: 0; background: #F5F4EF; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 32px rgba(0,0,0,0.18); display: flex; flex-direction: column">
    <div style="padding: 8px 20px 12px">
      <div style="display: flex; justify-content: center; padding-bottom: 8px"><span style="width: 40px; height: 5px; border-radius: 999px; background: #E2E0D8"></span></div>
      <div style="display: flex; align-items: center; gap: 12px">
        <h2 style="flex: 1; min-width: 0; margin: 0; font-family: Manrope, Inter, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Tilldela matlagning – Middag 2026-11-27</h2>
        <a href="PlaneraSchema.dc.html" aria-label="Stäng" style="width: 40px; height: 40px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E0D8; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><dc-import name="Icon" icon="x" size="18" hint-size="18px,18px"></dc-import></a>
      </div>
    </div>
    <div style="padding: 0 16px 32px; display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div class="row" style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; border: 1px solid transparent; opacity: {{r.opacity}}">
          <sc-if value="{{r.rest}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; background: #FEF3C7; color: #B45309; padding: 2px 8px; border-radius: 999px; font-weight: 600">Rester</span></sc-if>
          <span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 500">{{r.name}}</span>
          <div style="display: flex; align-items: center; gap: 4px">
            <button aria-label="Färre" style="width: 36px; height: 36px; border-radius: 999px; background: #EEEDE7; border: 0; font-weight: 700">−</button>
            <span style="width: 24px; text-align: center; font-size: 14px; font-weight: 600">{{r.n}}</span>
            <button aria-label="Fler" style="width: 36px; height: 36px; border-radius: 999px; background: #EEEDE7; border: 0; font-weight: 700">+</button>
            <span style="font-size: 12px; color: #5C6066">/ {{r.total}}</span>
          </div>
          <sc-if value="{{r.can}}" hint-placeholder-val="{{true}}"><a href="PlaneraSchema.dc.html" style="font-size: 12px; padding: 6px 12px; border-radius: 999px; background: #1F6B45; color: #FFFFFF; font-weight: 600">Tilldela</a></sc-if>
          <sc-if value="{{r.full}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; padding: 6px 10px; border-radius: 999px; background: #EEEDE7; color: #8A8E94">Fullt planerat</span></sc-if>
        </div>
      </sc-for>
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px; opacity: 0.4">
        <span style="flex: 1; font-size: 14px; font-weight: 500">Lasagne</span>
        <span style="font-size: 12px; color: #5C6066">3p tilldelade</span>
        <span style="font-size: 12px; color: #8A8E94; font-style: italic">Redan tillagd</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { name: 'Grön curry med ris', n: 1, total: 3 },
      { name: 'Köttfärssås med spagetti', n: 2, total: 4 },
      { name: 'Rester', n: 1, total: 2, rest: true },
      { name: 'Tacos', n: 0, total: 6, full: true },
      { name: 'Butter chicken', n: 0, total: 2, full: true }
    ];
    return { rows: raw.map(r => ({ ...r, rest: !!r.rest, full: !!r.full, can: !r.full, opacity: r.full ? 0.5 : 1 })) };
  }
}
</script>
</body>
</html>
